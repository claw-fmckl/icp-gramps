[package]
name = "server"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.18"
ic-asset-router = "0.1"
ic-rusqlite = { version = "0.4", features = ["precompiled"] }
ic-sql-migrate = { version = "0.0.5", features = ["sqlite"] }
include_dir = { version = "0.7", features = ["glob"] }
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
ic-asset-router = "0.1"
ic-sql-migrate = "0.0.5"

[profile.release]
lto = true
opt-level = "z"
